    "aiocache>=0.12.3",
    "aiofiles>=25.1.0",
    "black>=26.5.1",
    "faker>=40.23.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "motor>=3.7.1",
    "mypy>=2.1.0",
    "networkx>=3.6.1",
    "ollama>=0.6.2",
    "openai>=2.41.1",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.17.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.1.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.0.0",
    "rich>=15.0.0",
    "ruff>=0.15.17",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.4",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.26.7",
    "typing-extensions>=4.15.0",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
